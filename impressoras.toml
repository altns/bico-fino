# Perfis de impressora usados pelos scripts (volume útil, limites, multicor).
# Escolha a ativa com IMPRESSORA=<chave> no .env, com --impressora <chave> nos scripts,
# ou mudando "padrao" abaixo. Confira os valores no manual do seu modelo e acrescente o seu.
#
#   volume    = [X, Y, Z] em mm
#   bico_max  = temperatura máxima do bico (°C)
#   mesa_max  = temperatura máxima da mesa (°C)
#   fechada   = tem enclosure (ABS/ASA)
#   multicor  = número de filamentos no sistema multicor (1 = sem)

padrao = "ad5x"

[impressoras.ad5x]
nome = "Flashforge AD5X"
volume = [220, 220, 220]
bico_max = 300
mesa_max = 110
fechada = false
multicor = 4  # IFS

[impressoras.adventurer-5m]
nome = "Flashforge Adventurer 5M"
volume = [220, 220, 220]
bico_max = 280
mesa_max = 110
fechada = false
multicor = 1

