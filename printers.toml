# Printer profiles used by the scripts (build volume, limits, multi-color).
# Pick the active one with PRINTER=<key> in .env, with --printer <key> in the scripts,
# or by changing "default" below. Check the values against your model's manual and add your own.
#
#   build_volume    = [X, Y, Z] in mm
#   max_nozzle_temp = maximum nozzle temperature (°C)
#   max_bed_temp    = maximum bed temperature (°C)
#   enclosed        = has an enclosure (ABS/ASA)
#   filament_slots  = filaments in the multi-color system (1 = none)

default = "ad5x"

[printers.ad5x]
name = "Flashforge AD5X"
build_volume = [220, 220, 220]
max_nozzle_temp = 300
max_bed_temp = 110
enclosed = false
filament_slots = 4  # IFS

[printers.adventurer-5m]
name = "Flashforge Adventurer 5M"
build_volume = [220, 220, 220]
max_nozzle_temp = 280
max_bed_temp = 110
enclosed = false
filament_slots = 1

[printers.bambu-a1]
name = "Bambu Lab A1"
build_volume = [256, 256, 256]
max_nozzle_temp = 300
max_bed_temp = 100
enclosed = false
filament_slots = 4  # AMS lite

[printers.bambu-a1-mini]
