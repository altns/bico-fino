[project]
name = "bico-fino"
version = "0.1.0"
description = "Tools for modeling and preparing FDM 3D prints (any printer; profiles in printers.toml)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "trimesh[easy]>=4.5",
  "manifold3d>=3.0",
  "numpy",
  "shapely>=2.0",
  "matplotlib",
  "scipy",
  "rtree",
  "lxml",
  "build123d>=0.9",
  "pymeshlab",
  "flashforge-python-api>=1.6",
  "python-dotenv",
]

[tool.uv]
package = false
